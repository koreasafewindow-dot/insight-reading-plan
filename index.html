const D=RAW.split("\n").map(l=>{const[t,c]=l.split("|"),[id,p]=c.split("~");return{t,id,p}}),N=365,K="insight365";
const $=i=>document.getElementById(i);
let S={start:null,done:{}},only=false;
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
if(!S.start)S.start=iso(new Date());
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const link=(x,app)=>(app?"jwlibrary:///":"https://www.jw.org/")+"finder?srcid=jwlshare&wtlocale=KO&prefer=lang&docid=1200"+x.id+(x.p?"&par="+x.p:"");
const W="일월화수목금토";
function todayIdx(){const a=P(S.start),b=new Date();return Math.floor((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5)}
function render(){
 const s=P(S.start),ti=todayIdx();let h="";
 for(let i=0;i<N;i++){
  const dt=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),x=D[i],dn=!!S.done[i];
  if(only&&dn)continue;
  h+=`<div class="d${i===ti?" t":""}${dn?" x":""}" id="r${i}" data-m="${dt.getFullYear()}-${dt.getMonth()+1}"><input type="checkbox" data-i="${i}"${dn?" checked":""}><div class="b"><div class="m">${i+1}일차 · ${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()} (${W[dt.getDay()]})${i===ti?" · 오늘":""}${i>170?" · 분량 균등 분할":""}</div><div class="tt">${x?x.t:"표제어 준비 중"}</div></div>${x?`<a class="go" href="${link(x,1)}">앱</a><a href="${link(x,0)}" target="_blank" rel="noopener">웹</a>`:""}</div>`;
 }

 const s=P(S.start),seen=[],sy=s.getFullYear();let b="";
 for(let i=0;i<N;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),k=d.getFullYear()+"-"+(d.getMonth()+1);if(!seen.includes(k)){seen.push(k);b+=`<button data-m="${k}">${d.getMonth()+1}월${d.getFullYear()!==sy?"<sup>'"+String(d.getFullYear()).slice(2)+"</sup>":""}</button>`}}
 $("mon").innerHTML=b;
